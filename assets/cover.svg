<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <radialGradient id="glow-cyan" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-purple" cx="20%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-violet" cx="85%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Glow Filter -->
    <filter id="node-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg-grad)"/>
  <rect width="1920" height="1080" fill="url(#glow-cyan)"/>
  <rect width="1920" height="1080" fill="url(#glow-purple)"/>
  <rect width="1920" height="1080" fill="url(#glow-violet)"/>

  <!-- Isometric Cyber Grid Background -->
  <g opacity="0.12" stroke="#38BDF8" stroke-width="1.5">
    <line x1="900" y1="0" x2="500" y2="1080"/>
    <line x1="1060" y1="0" x2="660" y2="1080"/>
    <line x1="1220" y1="0" x2="820" y2="1080"/>
    <line x1="1380" y1="0" x2="980" y2="1080"/>
    <line x1="1540" y1="0" x2="1140" y2="1080"/>
    <line x1="1700" y1="0" x2="1300" y2="1080"/>
    <line x1="1860" y1="0" x2="1460" y2="1080"/>
    
    <line x1="800" y1="100" x2="1920" y2="100"/>
    <line x1="800" y1="240" x2="1920" y2="240"/>
    <line x1="800" y1="380" x2="1920" y2="380"/>
    <line x1="800" y1="520" x2="1920" y2="520"/>
    <line x1="800" y1="660" x2="1920" y2="660"/>
    <line x1="800" y1="800" x2="1920" y2="800"/>
    <line x1="800" y1="940" x2="1920" y2="940"/>
  </g>

  <!-- Network Graph / AI Agent Mesh -->
  <g stroke="#06B6D4" stroke-opacity="0.4" stroke-width="2">
    <line x1="1200" y1="220" x2="1420" y2="160"/>
    <line x1="1420" y1="160" x2="1680" y2="240"/>
    <line x1="1680" y1="240" x2="1780" y2="420"/>
    <line x1="1420" y1="160" x2="1520" y2="360"/>
    <line x1="1200" y1="220" x2="1300" y2="440"/>
    <line x1="1300" y1="440" x2="1520" y2="360"/>
    <line x1="1520" y1="360" x2="1780" y2="420"/>
    <line x1="1300" y1="440" x2="1440" y2="600"/>
    <line x1="1520" y1="360" x2="1660" y2="580"/>
    <line x1="1780" y1="420" x2="1660" y2="580"/>
    <line x1="1440" y1="600" x2="1660" y2="580"/>
    <line x1="1440" y1="600" x2="1320" y2="820"/>
    <line x1="1660" y1="580" x2="1760" y2="780"/>
    <line x1="1320" y1="820" x2="1560" y2="860"/>
    <line x1="1560" y1="860" x2="1760" y2="780"/>
    <line x1="1440" y1="600" x2="1560" y2="860"/>
  </g>

  <!-- Glowing Nodes -->
  <g filter="url(#node-glow)">
    <circle cx="1200" cy="220" r="10" fill="#38BDF8"/>
    <circle cx="1420" cy="160" r="14" fill="#818CF8"/>
    <circle cx="1680" cy="240" r="12" fill="#C084FC"/>
    <circle cx="1780" cy="420" r="11" fill="#38BDF8"/>
    <circle cx="1300" cy="440" r="12" fill="#F472B6"/>
    <circle cx="1520" cy="360" r="16" fill="#06B6D4"/>
    <circle cx="1440" cy="600" r="15" fill="#A855F7"/>
    <circle cx="1660" cy="580" r="14" fill="#38BDF8"/>
    <circle cx="1320" cy="820" r="11" fill="#818CF8"/>
    <circle cx="1560" cy="860" r="15" fill="#06B6D4"/>
    <circle cx="1760" cy="780" r="12" fill="#C084FC"/>
  </g>

  <!-- Glassmorphic Card Container -->
  <rect x="120" y="140" width="1050" height="800" rx="28" fill="url(#card-grad)" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="2"/>
  <line x1="148" y1="142" x2="1142" y2="142" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Content Elements -->
  <!-- Tag Badge -->
  <rect x="180" y="210" width="580" height="48" rx="12" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="205" y="242" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" letter-spacing="1.5">⚡ PRODUCTION AI ARCHITECTURE &amp; ENGINEERING</text>

  <!-- Main Titles -->
  <text x="180" y="340" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="56" letter-spacing="-0.5">Building a Production-Ready</text>
  <text x="180" y="420" fill="url(#title-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="56" letter-spacing="-0.5">Multi-Agent AI System</text>
  <text x="180" y="500" fill="url(#accent-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="56" letter-spacing="-0.5">With Persistent Memory &amp; MCP</text>

  <!-- Subtitle -->
  <text x="180" y="590" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="26">A comprehensive architectural guide to autonomous LLM agents,</text>
  <text x="180" y="630" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="26">FastEmbed local vector indexing, and Model Context Protocol.</text>

  <!-- Tech Badges -->
  <!-- Python -->
  <rect x="180" y="710" width="160" height="46" rx="10" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="202" y="740" fill="#34D399" font-family="sans-serif" font-weight="700" font-size="18">Python 3.11+</text>

  <!-- FastEmbed -->
  <rect x="360" y="710" width="145" height="46" rx="10" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="382" y="740" fill="#38BDF8" font-family="sans-serif" font-weight="700" font-size="18">FastEmbed</text>

  <!-- MCP -->
  <rect x="525" y="710" width="160" height="46" rx="10" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="547" y="740" fill="#C084FC" font-family="sans-serif" font-weight="700" font-size="18">MCP Protocol</text>

  <!-- FastAPI -->
  <rect x="705" y="710" width="120" height="46" rx="10" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="727" y="740" fill="#FBBF24" font-family="sans-serif" font-weight="700" font-size="18">FastAPI</text>

  <!-- Vector DB -->
  <rect x="845" y="710" width="165" height="46" rx="10" fill="#EC4899" fill-opacity="0.15" stroke="#EC4899" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="867" y="740" fill="#F472B6" font-family="sans-serif" font-weight="700" font-size="18">Vector Search</text>

  <!-- Meta Footer Divider -->
  <line x1="180" y1="810" x2="1080" y2="810" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1"/>
  <text x="180" y="855" fill="#64748B" font-family="sans-serif" font-weight="500" font-size="20">📖 12 Min Deep-Dive   •   💻 Full Open-Source Code Included   •   ⚡ Enterprise Ready</text>
</svg>
